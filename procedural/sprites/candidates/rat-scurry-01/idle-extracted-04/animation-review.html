<script>function hasSpriteAlpha(pixels) {
  if (!pixels.length || pixels.length % 4 !== 0) return false
  let transparent = false, visible = false
  for (let i = 3; i < pixels.length; i += 4) {
    transparent ||= pixels[i] === 0
    visible ||= pixels[i] > 0
  }
  return transparent && visible
}
