[package]
name = "scene-forge"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Bounded deterministic procedural scene compiler for the shared game environment library"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "scene-forge-cli"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
